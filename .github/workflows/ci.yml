# En cada push y pull request: lint, tests de dominio con cobertura mínima, tipos y compilación, y tests de pantalla en modo demo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lo mínimo: leer el código. Los artifacts usan su propio token.
permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (con tipos)
        run: npm run lint
      - name: Tests de dominio y cobertura
        run: npm run test:cobertura
      # build ya comprueba los tipos (tsc --noEmit) antes de compilar.
      - name: Tipos y compilación
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ejemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - name: Navegador para los tests de pantalla
        run: npx playwright install --with-deps chromium
      - name: Tests de pantalla (modo demo)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-playwright
          path: playwright-report
          retention-days: 7
